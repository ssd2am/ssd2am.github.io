<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's on your mind?</title>
    <style>
        body { font-family: Georgia, 'Times New Roman', Times, serif; padding: 50px; background: #f4f4f4; }
        .admin-card { background: white; padding: 30px;  max-width: 500px; margin: auto; border: solid 1px black;}
        h2 { color: black; margin-top: 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        input, textarea { font-family: Georgia, 'Times New Roman', Times, serif; width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid black;  box-sizing: border-box; }
        textarea { height: 150px; resize: none; }
        button { width: 100%; padding: 12px; background: white; border: solid black 1px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: black; color: white; }
    </style>
</head>
<body>
    <div class="admin-card">
        <h2>Now Box Editor</h2>
        <label>새로운 소식</label>
        <textarea id="new-content" placeholder="내용을 입력하세요..."></textarea>
        <button onclick="updateNow()">업데이트 하기</button>
        <p id="status-msg" style="margin-top:15px; font-size:0.85rem; color: #666;"></p>
    </div>

    <script>
            async function updateNow() {
        const content = document.getElementById('new-content').value;
        const status = document.getElementById('status-msg');
        
        status.innerText = "비서에게 전달 중...";

        try {
            const response = await fetch('/api/update', { // 우리가 만든 api 주소
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content })
            });

            const result = await response.json();
            if (response.ok) {
                status.innerText = "✅ " + result.message;
                document.getElementById('new-content').value = "";
            } else {
                status.innerText = "❌ 실패: " + result.message;
            }
        } catch (err) {
            status.innerText = "❌ 연결 오류: " + err.message;
        }
    }
    </script>
</body>
</html>
