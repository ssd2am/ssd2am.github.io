<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's on your mind?</title>
    <style>
        body { font-family: Georgia, 'Times New Roman', Times, serif; padding: 50px; background: #f4f4f4; }
        .admin-card { background: white; padding: 30px;  max-width: 500px; margin: auto; border: solid 1px black;}
        h2 { color: black; margin-top: 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        input, textarea { font-family: Georgia, 'Times New Roman', Times, serif; width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid black;  box-sizing: border-box; }
        textarea { height: 150px; resize: none; }
        button { width: 100%; padding: 12px; background: white; border: solid black 1px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: black; color: white; }
    </style>
</head>
<body>
    <div class="admin-card">
        <h2>Now Box Editor</h2>
        <label>GitHub Personal Access Token</label>
        <input type="password" id="gh-token" placeholder="ghp_로 시작하는 토큰 입력">
        
        <label>새로운 소식</label>
        <textarea id="new-content" placeholder="내용을 입력하세요..."></textarea>
        
        <button onclick="updateNow()">업데이트 하기</button>
        <p id="status-msg" style="margin-top:15px; font-size:0.85rem; color: #666;"></p>
    </div>

    <script>
         async function updateNow() {
            const token = document.getElementById('gh-token').value;
            const content = document.getElementById('new-content').value;
            const status = document.getElementById('status-msg');

            // 1. 설정 정보 (본인의 정보로 수정하세요)
            const owner = 'ssd2am'; 
            const repo = 'ssd2am.github.io'; 
            const path = 'now.json'; // 수정할 파일 경로

            if(!token || !content) {
                alert("토큰과 내용을 모두 입력해주세요!");
                return;
            }

            status.innerText = "업데이트 중...";

            try {
                // 2. 현재 파일의 'SHA'(버전 아이디)를 먼저 가져와야 수정이 가능합니다.
                const getRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`);
                const fileData = await getRes.json();
                const sha = fileData.sha;

                // 3. 새로운 데이터 준비
                const now = new Date();
                const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} · ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                
                const newData = {
                    date: dateStr,
                    content: content.replace(/\n/g, "<br>") // 줄바꿈을 <br>로 변환
                };

                // 4. GitHub API에 파일 업데이트 요청 (PUT)
                const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: "Update now.json via admin page",
                        content: btoa(unescape(encodeURIComponent(JSON.stringify(newData, null, 2)))), // 데이터를 Base64로 인코딩
                        sha: sha
                    })
                });

                if(putRes.ok) {
                    status.innerText = "✅ 성공! 잠시 후 사이트에 반영됩니다.";
                    document.getElementById('new-content').value = "";
                } else {
                    status.innerText = "❌ 실패: 토큰 권한을 확인하세요.";
                }
            } catch (err) {
                status.innerText = "❌ 에러 발생: " + err.message;
            }
        }
    </script>
</body>
</html>
