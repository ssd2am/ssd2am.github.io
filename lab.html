<script>
    const crow = document.getElementById('mystery-crow');

    function moveCrow() {
        // 화면 안에서만 움직이도록 계산
        const maxX = window.innerWidth - 100;
        const maxY = window.innerHeight - 100;
        
        const randomX = Math.floor(Math.random() * maxX);
        const randomY = Math.floor(Math.random() * maxY);
        
        crow.style.left = randomX + 'px';
        crow.style.top = randomY + 'px';
    }

    function spawnCrow() {
        crow.style.display = 'block'; 
        moveCrow(); // 나타나자마자 랜덤 위치로 점프!
    }

    function byeCrow() {
        crow.style.display = 'none'; 
    }
</script>

</body>
